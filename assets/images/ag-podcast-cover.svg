  <path d="M165 1020 C410 760 575 1000 805 780 C1065 530 1285 628 1458 382" fill="none" stroke="#d6b273" stroke-opacity=".34" stroke-width="9"/>
  <path d="M216 1095 C460 890 620 1082 846 850 C1086 606 1265 710 1416 540" fill="none" stroke="#fff6df" stroke-opacity=".14" stroke-width="3"/>
