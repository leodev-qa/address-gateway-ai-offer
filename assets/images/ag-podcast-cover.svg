<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">The Qatar Company Formation Brief podcast cover</title>
  <desc id="desc">Premium navy and sand podcast cover for Address Gateway's Qatar company formation briefing channel.</desc>
  <defs>
    <radialGradient id="glow" cx="72%" cy="18%" r="82%">
      <stop offset="0%" stop-color="#35b6d3" stop-opacity=".24"/>
      <stop offset="44%" stop-color="#17385f" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#07101b"/>
    </radialGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6df"/>
      <stop offset="48%" stop-color="#d6b273"/>
      <stop offset="100%" stop-color="#8f7041"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3445"/>
      <stop offset="100%" stop-color="#5f1826"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#02070d" flood-opacity=".58"/>
